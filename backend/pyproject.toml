[project]
name = "pollution-backend"
version = "0.1.0"
description = "Backend for the pollution intelligence platform (FastAPI + PostGIS)."
requires-python = ">=3.11"
# Compatible ranges here; exact versions for Docker live in requirements.lock
# (regenerate with scripts/lock-backend.sh after changing this list).
dependencies = [
    "fastapi>=0.141,<1.0",
    "uvicorn[standard]>=0.52,<1.0",
    "pydantic-settings>=2.15,<3.0",
    "sqlalchemy>=2.0.52,<2.1",
    "psycopg[binary]>=3.3,<4.0",
    "alembic>=1.14,<2.0",
    "geoalchemy2>=0.15,<1.0",
    "h3>=4.1,<5.0",
    "httpx>=0.28,<1.0",
    # Sentinel-5P L2 swaths are HDF5/NetCDF4. h5py reads the geolocated
    # calibrated index and NumPy applies the product's scale/offset metadata.
    "h5py>=3.12,<4.0",
    "numpy>=2.0,<3.0",
    # F2: decode a submitted photo and re-encode the reviewer-facing derivative
    # from the decoded pixels, which is the only way to drop EXIF (including GPS)
    # and to refuse a file that merely claims to be an image. Pinned minor because
    # 11.x is the first line with the decompression-bomb guard this relies on.
    "pillow>=11.0,<12.0",
    # F2: multipart/form-data parsing for the evidence upload. FastAPI refuses to
    # register a route that takes an UploadFile without it, so this is a hard
    # requirement of the endpoint, not an optimisation.
    "python-multipart>=0.0.20",
    # Private, durable storage for citizen photo evidence on serverless hosts.
    "boto3>=1.40,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10.0",
    # 0.26 and earlier cap pytest<9, which downgrades pytest silently on
    # install — 1.x is the first line compatible with pytest 9.
    "pytest-asyncio>=1.0,<2.0",
    "ruff>=0.16,<0.17",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
# Absolute imports only, so tests/test_architecture.py can check layer boundaries.
ban-relative-imports = "all"

[tool.ruff.lint.flake8-bugbear]
# B008 ("no function calls in argument defaults") otherwise flags every
# FastAPI Depends()/Query()/Path() — that pattern is how FastAPI's DI works.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.vercel]
# Vercel's FastAPI framework preset routes every request to this ASGI app.
# Declared explicitly (rather than relying on entrypoint auto-detection) since
# app/main.py builds the instance via create_app(). Dependencies are installed
# from this file's [project.dependencies]; see docs/DEPLOYMENT_PLAN.md.
entrypoint = "app.main:app"
