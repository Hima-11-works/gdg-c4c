services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the compose network the database is the "db" service on its
      # internal port, regardless of what .env says for host-side runs.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      # Keep migration revisions in sync with the working tree. The startup
      # command runs Alembic before serving; without this mount an older image
      # can run new route code against a schema that is missing new tables.
      - ./backend/alembic:/app/alembic:ro
      # F2: the citizen-photo evidence store. A named volume, not a path inside
      # the container, because these are the only bytes the platform holds that
      # nobody can re-derive: a `docker compose up --force-recreate` against an
      # ephemeral directory silently destroys every uploaded photo while the
      # database keeps saying the evidence exists. This is the same reason
      # db_data is a volume.
      - citizen_media:/var/lib/air-health
    # Overrides the Dockerfile's CMD (which omits --reload) for dev hot-reload;
    # keep the "alembic upgrade head &&" prefix here too, or schema changes
    # won't be applied when iterating with docker-compose.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"
      interval: 10s
      timeout: 6s
      retries: 5

volumes:
  db_data:
  # F2: citizen photo evidence. See the api service's mount for why this is a
  # volume rather than a directory in the container.
  citizen_media:
