name: air_health_flutter
description: "Air quality health companion — personal exposure awareness."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management & DI
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^15.1.3

  # Notifications
  flutter_local_notifications: ^19.2.1

  # Timezone handling for scheduled forecast alarms (zonedSchedule needs TZDateTime).
  timezone: ^0.10.1

  # Location & permissions
  geolocator: ^14.0.1
  permission_handler: ^11.4.0

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # Charts
  fl_chart: ^0.71.0

  # HTTP (grid API integration)
  dio: ^5.8.0+1

  # Formatting
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
