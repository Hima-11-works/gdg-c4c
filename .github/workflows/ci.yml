name: CI and demo builds

on:
  pull_request:
  push:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and migration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgis:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: air_health_test
          POSTGRES_USER: air_health
          POSTGRES_PASSWORD: air_health_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U air_health -d air_health_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      DATABASE_URL: postgresql://air_health:air_health_test@localhost:5432/air_health_test
      RUN_DB_TESTS: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked backend dependencies
        run: uv sync --locked --extra dev
      - name: Check backend style
        # The existing repository has legacy Ruff findings outside this P1
        # work. Keep the release gate green and lint the maintained P1 service
        # surfaces while the older backlog is handled separately.
        run: >-
          uv run --locked ruff check
          app/services/incident_webhook.py
          app/services/impact_evidence.py
          app/federation_aggregator.py
          tests/test_incident_webhook_service.py
          tests/test_impact_evidence.py
          tests/test_forecasting_service.py
      - name: Apply all database migrations
        run: uv run --locked alembic upgrade head
      - name: Run backend unit and PostgreSQL tests
        run: uv run --locked pytest -q

  frontend:
    name: Dashboard build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dashboard dependencies
        run: npm ci
      - name: Lint dashboard
        run: npm run lint
      - name: Build dashboard
        run: npm run build

  flutter:
    name: Flutter tests and demo APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: partner_apps/air_health_flutter
            artifact: air-health-citizen-demo
          - app: partner_apps/fire_dept_simulator
            artifact: fire-dept-simulator-demo
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
          cache-dependency-path: ${{ matrix.app }}/pubspec.lock
      - name: Resolve locked Flutter dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze Flutter app
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test --no-pub
      - name: Build demo APK
        run: flutter build apk --release --no-pub
      - name: Upload demo APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
