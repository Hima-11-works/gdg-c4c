name: Pollution pipeline

# Invokes the collector worker against the hosted database. PostgreSQL owns
# durable job leases and provider budgets; Actions only wakes due work.
#
# Repository configuration:
#   secret   DATABASE_URL         direct (non-pooler) Neon connection string
#   variable PIPELINE_DEMO_MODE   "true" for synthetic fixtures, otherwise "false"
#   secret   OPENAQ_API_KEY       required when PIPELINE_DEMO_MODE=false
#   secret   FIRMS_MAP_KEY        optional NASA FIRMS features in live mode
#   secret   CDSE_REFRESH_TOKEN   optional live Sentinel-5P scans
#   secret   CDSE_SECRET_ENCRYPTION_KEY  Fernet key for persisted token rotation
#   variable HOTSPOT_SCAN_BACKEND database to share scans with the API
#
# GitHub only runs scheduled workflows on the default branch, and pauses a
# schedule after ~60 days without repository activity.
#
# See docs/DEPLOYMENT_PLAN.md.

on:
  schedule:
    # The worker claims only database jobs that are due; this cadence allows
    # source schedules shorter than GitHub Actions' previous hourly cadence.
    - cron: "*/5 * * * *"
    # Run the storage retention sweep daily, not on every collector wake-up.
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pollution-pipeline
  cancel-in-progress: false

defaults:
  run:
    working-directory: backend

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DEMO_MODE: ${{ vars.PIPELINE_DEMO_MODE || 'false' }}
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
      CDSE_REFRESH_TOKEN: ${{ secrets.CDSE_REFRESH_TOKEN }}
      CDSE_SECRET_ENCRYPTION_KEY: ${{ secrets.CDSE_SECRET_ENCRYPTION_KEY }}
      HOTSPOT_SCAN_BACKEND: ${{ vars.HOTSPOT_SCAN_BACKEND || 'database' }}
      CITIZEN_MEDIA_STORAGE: ${{ vars.CITIZEN_MEDIA_STORAGE || 'disabled' }}
      CITIZEN_MEDIA_S3_BUCKET: ${{ vars.CITIZEN_MEDIA_S3_BUCKET }}
      CITIZEN_MEDIA_S3_REGION: ${{ vars.CITIZEN_MEDIA_S3_REGION || 'us-east-1' }}
      CITIZEN_MEDIA_S3_ENDPOINT_URL: ${{ vars.CITIZEN_MEDIA_S3_ENDPOINT_URL }}
      CITIZEN_MEDIA_S3_ACCESS_KEY_ID: ${{ secrets.CITIZEN_MEDIA_S3_ACCESS_KEY_ID }}
      CITIZEN_MEDIA_S3_SECRET_ACCESS_KEY: ${{ secrets.CITIZEN_MEDIA_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check DATABASE_URL is configured
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Set the DATABASE_URL repository secret (a direct Neon connection string)."
            exit 1
          fi

      - name: Validate data mode and live provider configuration
        run: |
          if [[ "$DEMO_MODE" != "true" && "$DEMO_MODE" != "false" ]]; then
            echo "::error::PIPELINE_DEMO_MODE must be exactly 'true' or 'false'."
            exit 1
          fi
          if [[ "$DEMO_MODE" == "false" && -z "$OPENAQ_API_KEY" ]]; then
            echo "::error::Set the OPENAQ_API_KEY repository secret for live pipeline runs."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        run: python -m pip install -r requirements.lock

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run due collector jobs
        run: python -m app.cli collect-due

      - name: Verify photo storage and expire old evidence
        if: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 0 * * *') && vars.CITIZEN_MEDIA_STORAGE == 's3' }}
        run: python -m app.cli verify-media-storage --sweep-expired
